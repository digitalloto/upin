# UPIN box configuration. Copy to /etc/upin/box.toml and edit.
# Every number marked ASSUMPTION is a starting guess, not a measurement:
# replace it once the airframe and sensors have been measured.

[airframe]
# From the airframe's spec, or Envelope.from_airframe(thrust_to_mass, airspeed).
# Too tight -> false alarms. Too loose -> more spoofing gets through.
max_accel_ms2 = 6.0          # EDIT: maximum horizontal acceleration
max_airspeed_ms = 20.0       # EDIT: top airspeed
max_wind_ms = 15.0

[ports]
receiver_port = "/dev/ttyUSB0"   # the new GNSS receiver (USB-UART), or /dev/ttyAMA1
receiver_baud = 115200           # set the receiver's port to this rate
fc_connection = "/dev/ttyAMA0"   # UART to the flight controller's TELEM port
fc_baud = 921600                 # must match SERIALn_BAUD on the flight controller

[output]
gps_id = 1                   # 1 = the flight controller's GPS 2
shadow = true                # the flight controller keeps flying on its own GPS 1
forward_degraded = false     # when GNSS is distrusted, send no fix
max_degraded_h_acc_m = 50.0
power_check_action = "warn"  # signal-power spoof check (layer 146): "warn" until its
                             # thresholds are calibrated on this receiver's logs,
                             # then "distrust" to make it a hard check

[learned]
airframe_id = ""             # EDIT: the airframe id used with tools/learn_from_flight.py
learned_io_model = ""        # AI motion predictor (layer 147): path to the live model
                             # from your flight library, e.g. upin_flights/models/v4.npz;
                             # "" keeps it off

[flow]
flow_check_action = "distrust"  # optical-flow integrity: a suspect flow (e.g. a moving
                                # pattern on the ground) is not fed to the filter.
                                # "warn" feeds it anyway -- in simulation a fooled flow
                                # then poisoned the estimate

[camera]
camera = ""                  # "pi" for the Pi camera (needs pip install -e ".[camera]"), "" = off
camera_fov_deg = 62.0        # ASSUMPTION: Pi camera v2; put the real lens's horizontal FOV here
camera_size_px = 256
tag_map = ""                 # e.g. /etc/upin/tags.json (see deploy/tags.example.json):
                             # surveyed UPIN tags; layer 149 gives a fix whenever one is in view
camera_flow = false          # layer 148: UPIN's own optical flow from the camera frames,
                             # with weighted RANSAC against moving ground patterns
range_sigma_m = 0.1          # ASSUMPTION: the rangefinder's 1-sigma, from its datasheet

[beacons]
beacon_radio = ""            # serial port of the ranging radio (JSON lines; see upin/box/beacon_radio.py)
beacon_radio_baud = 115200
beacon_secret_file = ""      # the shared secret the beacons sign and hop with; keep it off the repo
breadcrumbs = false          # layer 152: drop position-stamped crumbs as jamming rises
breadcrumb_spacing_m = 300.0
breadcrumb_max = 6
breadcrumb_drop_agl_m = 50.0 # ASSUMPTION: fall height when no rangefinder reports it
formation = false            # layer 153: drones in formation confirm each other's fixes over the beacon radio
drone_id = ""                # this drone's name in the formation, e.g. "lead"; needed when formation = true
formation_check_action = "warn"  # "distrust" once the radio's ranging sigma is measured (the check is warn-only until then)

[leo]
sdr = ""                     # "rtl" for an RTL-SDR dongle (pip install -e ".[sdr]"); "" = off
leo_satellites = ""          # satellites.json: name, TLE lines and carrier_hz per satellite,
                             # fetched before the mission (TLEs older than 7 days are refused)

[sensors]
heading_sigma_deg = 5.0      # ASSUMPTION: compass/attitude heading error
flow_sigma_ms = 0.3          # ASSUMPTION: optical-flow velocity error
min_flow_quality = 100       # ASSUMPTION: 0..255, below this flow is ignored
baro_sigma_m = 1.0           # ASSUMPTION: baro altitude change error, minutes scale
fc_gps_max_age_s = 1.0

[log]
log_path = "/var/log/upin/box.jsonl"
